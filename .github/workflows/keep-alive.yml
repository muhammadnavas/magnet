name: Keep Render Backend Alive

# ─── Schedule ───────────────────────────────────────────────────────────────
# Pings the backend 5 times a day at ~4 hour 50 min intervals.
# All times in UTC (IST = UTC + 5:30):
#
#   01:30 UTC  →  07:00 IST   (Good morning)
#   06:20 UTC  →  11:50 IST   (Mid-morning)
#   11:10 UTC  →  16:40 IST   (Afternoon)
#   16:00 UTC  →  21:30 IST   (Evening)
#   20:50 UTC  →  02:20 IST   (Late night, keeps it warm for early morning)
# ────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "30 1  * * *"   # 07:00 IST
    - cron: "20 6  * * *"   # 11:50 IST
    - cron: "10 11 * * *"   # 16:40 IST
    - cron: "0  16 * * *"   # 21:30 IST
    - cron: "50 20 * * *"   # 02:20 IST next day
  workflow_dispatch:         # Allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Backend (${{ github.event.schedule || 'manual' }})
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping /health endpoint
        run: |
          echo "⏰ Pinging Orio backend at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🌐 URL: ${{ secrets.RENDER_BACKEND_URL }}/health"

          RESPONSE=$(curl --silent \
                          --max-time 60 \
                          --retry 3 \
                          --retry-delay 5 \
                          --retry-connrefused \
                          --write-out "\n---\nHTTP_STATUS:%{http_code} | TIME:%{time_total}s" \
                          "${{ secrets.RENDER_BACKEND_URL }}/health")

          echo "$RESPONSE"

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Backend is alive (HTTP $HTTP_STATUS)"
          else
            echo "❌ Unexpected status: HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Wake up summary
        if: always()
        run: |
          echo "─────────────────────────────────────────"
          echo "  Orio Keep-Alive — $(date -u '+%A %d %b %Y, %H:%M UTC')"
          echo "  IST: $(TZ='Asia/Kolkata' date '+%H:%M')"
          echo "─────────────────────────────────────────"
